[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfx1010-attention"
version = "0.1.0"
description = "Reusable fused attention kernels tuned for AMD gfx1010"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gfx1010-attention-precompile = "gfx1010_attention.precompile:main"

[tool.setuptools.packages.find]
include = ["gfx1010_attention*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
